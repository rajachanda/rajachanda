name: Generate LeetCode Heatmap

on:
  schedule:
    - cron: '0 0 * * *' # daily UTC
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Generate heatmap SVG
        run: |
          python scripts/generate_leetcode_heatmap.py chanda_raja_90 assets/leetcode-heatmap.svg

      - name: Commit heatmap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/leetcode-heatmap.svg
          git commit -m "chore: update leetcode heatmap [skip ci]" || echo "No changes to commit"
          git push
